<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ranas en Rebelión</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="stylesheet" href="estilo-1848.css">
</head>
<body><main>
<section id="menu" class="welcome">
  <div class="stars">✦　·　✦　　·　✦　·　✦</div>
  <div class="logo-frog">🐸</div>
  <h1>RANAS<br><span>EN REBELIÓN</span></h1>
  <p class="tagline">El pantano contraataca</p>
  <div class="platform platform-back"></div><div class="platform platform-front"></div>
  <div class="welcome-frog">🐸</div><div class="welcome-human">🧑</div>
  <div class="start-area"><button id="start" class="play">▶ JUGAR</button><p>Un shooter 2D de plataformas y aventuras</p></div>
  <div class="choices"><button class="choice selected" data-class="mage"><b>🐸✨</b><strong>MAGO</strong></button><button class="choice" data-class="sword"><b>🐸⚔️</b><strong>ESPADACHÍN</strong></button><button class="choice" data-class="dark"><b>🐸🌑</b><strong>RANA OSCURA</strong></button></div>
  <p class="tip">Elegí tu rana y defendé el pantano.</p>
</section>
<section id="gamebox" hidden><div class="hud"><span id="level">Nivel 1</span><span id="scene">Pantano Verde</span><span id="score">⭐ 0</span><span id="lives">❤️ 100</span></div><canvas id="game"></canvas><div class="controls"><div class="pad"><button data-key="ArrowUp">▲</button><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></div><div class="actions"><button id="power">⚡<small>PODER</small></button><button id="shoot">🔮<small>ATACAR</small></button></div></div></section>
<section id="modal" class="panel modal" hidden><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalButton" class="primary"></button></section>
</main><script src="juego-1848.js"></script></body></html>
