<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<body><main>
<header><h1>🐸 RANAS EN REBELIÓN</h1><div class="sub">Las ranas contraatacan</div></header>
<section id="menu" class="panel"><h2>Elegí tu rana</h2><div class="choices">
<button class="choice selected" data-class="mage"><b>🐸✨</b><strong>Rana Mago</strong><small>Rayos mágicos · Equilibrada</small></button>
<button class="choice" data-class="sword"><b>🐸⚔️</b><strong>Rana Espadachín</strong><small>Golpe cercano · Mucha vida</small></button>
<button class="choice" data-class="dark"><b>🐸🌑</b><strong>Rana Oscura</strong><small>Orbes sombríos · Daño alto</small></button>
</div><button id="start" class="primary">EMPEZAR AVENTURA</button><p class="tip">Cada 5 niveles se desbloquea un escenario y nuevas ranas aliadas.</p></section>
<section id="gamebox" hidden><div class="hud"><span id="level">Nivel 1</span><span id="scene">Pantano Verde</span><span id="score">⭐ 0</span><span id="lives">❤️ 100</span></div><canvas id="game"></canvas><div class="controls"><div class="pad"><button data-key="ArrowUp">▲</button><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></div><div class="actions"><button id="power">⚡<small>PODER</small></button><button id="shoot">🔮<small>ATACAR</small></button></div></div></section>
<section id="modal" class="panel modal" hidden><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalButton" class="primary"></button></section>
</main><script src="game.js?v=20260912-1827"></script></body></html>
