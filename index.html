<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ranas en Rebelión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>🐸 Ranas en Rebelión</h1>
    <p class="help">Movete, apuntá y lanzá burbujas contra los invasores.</p>
    <canvas id="game" aria-label="Juego Ranas en Rebelión"></canvas>
    <section class="controls" aria-label="Controles táctiles">
      <div class="pad">
        <button data-key="ArrowUp">▲</button>
        <div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>
      </div>
      <button id="shoot">🫧<br><small>DISPARAR</small></button>
    </section>
    <button id="restart">Reiniciar</button>
  </main>
  <script src="game.js"></script>
</body>
</html>
